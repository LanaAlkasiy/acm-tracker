<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACM Tracker — roll &amp; vote log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Optional: enables one shared live tracker across every visitor when
     hosted as a plain static page (e.g. GitHub Pages). See FIREBASE_CONFIG
     near the top of the script below. Harmless no-op if unconfigured or if
     this script host is blocked (e.g. inside a Claude artifact preview). -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root {
    --paper: #EFEBE1;
    --paper-2: #E6E0D0;
    --paper-3: #DCD5BF;
    --ink: #232A2E;
    --ink-soft: #5B6670;
    --ink-faint: #8B9398;
    --line: #CBC2A9;
    --gold: #9C6E20;
    --gold-soft: #E4C88C;
    --green: #3B6E4E;
    --green-soft: #CFE2D4;
    --red: #9B3A2A;
    --red-soft: #EFD4CC;
    --teal: #37676D;
    --teal-soft: #CFE1E2;
    --plum: #6C4E80;
    --plum-soft: #E1D5EA;
    --card-shadow: 0 1px 0 rgba(35,42,46,0.06);
    --radius: 8px;
    --radius-lg: 14px;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191D22;
      --paper-2: #20252B;
      --paper-3: #272D34;
      --ink: #EAE4D4;
      --ink-soft: #A9A491;
      --ink-faint: #6E7580;
      --line: #38404A;
      --gold: #DCB967;
      --gold-soft: #4A3D1F;
      --green: #7FC49B;
      --green-soft: #1F3A2B;
      --red: #E28E76;
      --red-soft: #3E2420;
      --teal: #8FC7CB;
      --teal-soft: #1E3538;
      --plum: #C6A9DA;
      --plum-soft: #362A42;
      --card-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --paper: #191D22;
    --paper-2: #20252B;
    --paper-3: #272D34;
    --ink: #EAE4D4;
    --ink-soft: #A9A491;
    --ink-faint: #6E7580;
    --line: #38404A;
    --gold: #DCB967;
    --gold-soft: #4A3D1F;
    --green: #7FC49B;
    --green-soft: #1F3A2B;
    --red: #E28E76;
    --red-soft: #3E2420;
    --teal: #8FC7CB;
    --teal-soft: #1E3538;
    --plum: #C6A9DA;
    --plum-soft: #362A42;
    --card-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  html, body { height: 100%; }
  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------- shell ---------- */
  #app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .wordmark { display: flex; align-items: center; gap: 10px; }
  .wordmark .brandmark {
    height: 56px; width: auto; display: block; flex: none;
  }
  :root[data-theme="dark"] .wordmark .brandmark { filter: invert(1); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .wordmark .brandmark { filter: invert(1); }
  }
  .wordmark h1 {
    font-family: var(--serif); font-weight: 600;
    font-size: 22px; margin: 0; letter-spacing: 0.2px;
  }
  .wordmark .tag { font-size: 12.5px; color: var(--ink-soft); font-family: var(--mono); }
  .sync-badge {
    font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px;
    margin-left: 4px;
  }
  .sync-live { background: var(--green-soft); color: var(--green); }
  .sync-local { background: var(--paper-3); color: var(--ink-faint); }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--paper-2); color: var(--ink);
    border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-btn:hover { background: var(--paper-3); }

  .body-wrap { display: flex; flex: 1; min-height: 0; }

  nav.rail {
    width: 190px; flex: none; padding: 18px 10px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  nav.rail button {
    text-align: left; border: none; background: transparent; color: var(--ink-soft);
    padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14.5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  nav.rail button .count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
  nav.rail button:hover { background: var(--paper-2); color: var(--ink); }
  nav.rail button.active { background: var(--paper-3); color: var(--ink); font-weight: 600; }
  nav.rail hr { border: none; border-top: 1px solid var(--line); margin: 10px 6px; width: calc(100% - 12px); }

  main.view { flex: 1; min-width: 0; padding: 22px 26px 60px; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .view-head h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0; }
  .view-head p.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 13.5px; }

  .btn {
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 9px 15px; border-radius: var(--radius); font-size: 13.5px; cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { opacity: 0.88; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--paper-2); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.small { padding: 6px 11px; font-size: 12.5px; }

  /* ---------- ledger rows ---------- */
  .ledger { border-top: 1px solid var(--line); }
  .entry-row {
    display: grid;
    grid-template-columns: 1fr auto auto 110px 20px;
    gap: 16px; align-items: center;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
    cursor: pointer; background: transparent;
  }
  .entry-row:hover { background: var(--paper-2); }
  .entry-name { font-family: var(--serif); font-size: 16.5px; font-weight: 500; }
  .entry-name .type-pill { margin-left: 9px; }
  .entry-date { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .entry-time { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .entry-ratio { text-align: right; }
  .entry-ratio .nums { font-family: var(--mono); font-size: 13px; }
  .entry-ratio .bar { height: 4px; background: var(--paper-3); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .entry-ratio .bar > span { display: block; height: 100%; background: var(--green); }
  .chev { color: var(--ink-faint); font-size: 14px; }

  .type-pill {
    display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px;
    font-family: var(--sans); font-weight: 500; vertical-align: middle;
  }
  .type-online { background: var(--teal-soft); color: var(--teal); }
  .type-inperson { background: var(--gold-soft); color: var(--gold); }
  .type-volunteering { background: var(--green-soft); color: var(--green); }
  .type-workshop { background: var(--plum-soft); color: var(--plum); }
  .type-social { background: var(--red-soft); color: var(--red); }
  .type-other { background: var(--paper-3); color: var(--ink-soft); }

  .pos-events { background: var(--teal-soft); color: var(--teal); }
  .pos-tech { background: var(--gold-soft); color: var(--gold); }
  .pos-creative { background: var(--plum-soft); color: var(--plum); }
  .pos-lead { font-weight: 700; }
  .pos-president { background: var(--green); color: var(--paper); font-weight: 700; }
  .pos-vp { background: var(--green-soft); color: var(--green); font-weight: 700; }
  .pos-secretary { background: var(--green-soft); color: var(--green); }

  .member-group { margin-bottom: 24px; }
  .member-group-title {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft);
    letter-spacing: 0.03em; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between;
  }
  .member-group-title .count { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .member-row { padding: 13px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .member-row:hover { background: var(--paper-2); }
  .member-main { display: flex; align-items: center; gap: 9px; }
  .member-name { font-family: var(--serif); font-size: 15.5px; font-weight: 500; }
  .member-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  .tasks-layout { display: flex; border-top: 1px solid var(--line); min-height: 320px; }
  .tasks-sidebar { width: 220px; flex: none; padding: 12px 8px; border-right: 1px solid var(--line); }
  .task-group-label { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); padding: 11px 8px 4px; letter-spacing: 0.03em; }
  .task-person {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    text-align: left; border: none; background: transparent; padding: 8px 10px;
    border-radius: var(--radius); font-size: 13.5px; color: var(--ink-soft); cursor: pointer;
  }
  .task-person:hover { background: var(--paper-2); }
  .task-person.active { background: var(--paper-3); color: var(--ink); font-weight: 600; }
  .task-person .count { font-family: var(--mono); font-size: 10.5px; background: var(--gold-soft); color: var(--gold); padding: 1px 7px; border-radius: 999px; }
  .tasks-main { flex: 1; min-width: 0; padding: 16px 22px; }
  .task-member-head { margin-bottom: 16px; }
  .task-member-head h3 { font-family: var(--serif); font-size: 18px; margin: 0; display: flex; align-items: center; }
  .task-add-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .task-add-row input[type="text"] {
    flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--paper-2); color: var(--ink); font-size: 13.5px;
  }
  .task-add-row input[type="date"] {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper-2); color: var(--ink); font-size: 13px;
  }
  .task-row { display: flex; align-items: center; gap: 11px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .task-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); flex: none; }
  .task-row .t-title { flex: 1; font-size: 14px; }
  .task-row.done .t-title { text-decoration: line-through; color: var(--ink-faint); }
  .task-row .t-deadline { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .task-row .t-deadline.overdue { color: var(--red); font-weight: 600; }
  .task-row .t-del { border: none; background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 16px; line-height: 1; }
  .task-row .t-del:hover { color: var(--red); }

  .empty {
    padding: 50px 10px; text-align: center; color: var(--ink-soft);
  }
  .empty .big { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--ink); margin-bottom: 6px; }

  /* ---------- panel (slide-over) ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(20,20,15,0.32); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: -480px; width: min(460px, 100vw); height: 100dvh;
    background: var(--paper); border-left: 1px solid var(--line); z-index: 41;
    display: flex; flex-direction: column; transition: right .22s ease;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel.show { right: 0; }
  .panel-head {
    padding: 20px 22px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-head h3 { font-family: var(--serif); font-weight: 600; font-size: 19px; margin: 0; }
  .panel-close { border: none; background: transparent; font-size: 20px; cursor: pointer; color: var(--ink-soft); line-height: 1; }
  .panel-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-family: var(--mono); }
  .field input[type="text"], .field input[type="date"], .field input[type="time"], .field select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper-2); color: var(--ink); font-family: var(--sans); font-size: 14px;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .roster-search { margin-bottom: 10px; }
  .roster-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .roster-cols .col-title { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .roster-person { display: flex; align-items: center; gap: 7px; padding: 5px 2px; font-size: 13.5px; }
  .roster-person input { accent-color: var(--gold); width: 15px; height: 15px; flex: none; }
  .roster-person label { cursor: pointer; }
  .roster-empty { color: var(--ink-faint); font-size: 12.5px; padding: 6px 2px; }
  .add-person-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-person-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); color: var(--ink); font-size: 13px; }
  .panel-foot { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; }
  .panel-foot .right { display: flex; gap: 10px; }

  /* ---------- people tab ---------- */
  .people-grid { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
  .person-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .person-row .nm { font-size: 14.5px; }
  .person-row .rm { border: none; background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 16px; }
  .person-row .rm:hover { color: var(--red); }
  .add-inline { display: flex; gap: 10px; margin-bottom: 16px; max-width: 380px; }
  .add-inline input { flex: 1; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); color: var(--ink); font-size: 14px; }

  /* ---------- overview ---------- */
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 26px; }
  .stat-card { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; background: var(--paper-2); }
  .stat-card .num { font-family: var(--mono); font-size: 26px; font-weight: 600; }
  .stat-card .lbl { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .insight-block { margin-bottom: 30px; }
  .insight-block h4 { font-family: var(--serif); font-weight: 600; font-size: 16px; margin: 0 0 12px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 70px; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bar-row .lbl { font-size: 13px; }
  .bar-row .track { height: 9px; background: var(--paper-3); border-radius: 5px; overflow: hidden; }
  .bar-row .track > span { display: block; height: 100%; border-radius: 5px; }
  .bar-row .val { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); text-align: right; }

  .time-list { border-top: 1px solid var(--line); }
  .time-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .time-row .t { font-family: var(--mono); }
  .time-row .v { color: var(--ink-soft); font-size: 12.5px; }

  .banner {
    background: var(--gold-soft); color: var(--gold); border-radius: var(--radius);
    padding: 9px 14px; font-size: 12.5px; margin-bottom: 16px;
  }

  /* ---------- mobile ---------- */
  @media (max-width: 760px) {
    .body-wrap { flex-direction: column; }
    nav.rail {
      width: 100%; flex-direction: row; overflow-x: auto; border-right: none;
      border-bottom: 1px solid var(--line); padding: 10px 12px; gap: 6px;
    }
    nav.rail hr { display: none; }
    nav.rail button { white-space: nowrap; }
    main.view { padding: 18px 16px 50px; }
    .entry-row { grid-template-columns: 1fr auto 16px; row-gap: 4px; }
    .entry-date, .entry-time { font-size: 11.5px; }
    .entry-time { display: none; }
    .entry-ratio { grid-column: 1 / -1; text-align: left; }
    .panel { width: 100vw; right: -100vw; }
    .roster-cols { grid-template-columns: 1fr 1fr; }
    .tasks-layout { flex-direction: column; }
    .tasks-sidebar {
      width: 100%; border-right: none; border-bottom: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .task-group-label { width: 100%; padding-top: 6px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="app-state">{"people":[],"meetings":[],"members":[],"tasks":[]}</script>
<script>
(function () {
  "use strict";
  var SCRIPT_CLOSE = "<" + "/script>";

    if (memberId) {
      var mem = state.members.filter(function (x) { return x.id === memberId; })[0];
      memberDraft = {
        id: mem.id, name: mem.name, phone: mem.phone || "", email: mem.email || "",
        major: mem.major || "", position: mem.position || POSITIONS[0]
      };
    } else {
      memberDraft = { id: null, name: "", phone: "", email: "", major: "", position: POSITIONS[0] };
    }
    ui.panelKind = "member";
    ui.editingId = memberId || null;
    ui.panelOpen = true;
    render();
    var nameInput = document.getElementById("m-name");
    if (nameInput) nameInput.focus();
  }

  function saveMember(d) {
    var next = { people: state.people, meetings: state.meetings, members: state.members.slice(), tasks: state.tasks };
    var record = { id: d.id || uid(), name: d.name.trim(), phone: d.phone.trim(), email: d.email.trim(), major: d.major.trim(), position: d.position };
    var idx = next.members.findIndex(function (x) { return x.id === record.id; });
    if (idx >= 0) next.members[idx] = record; else next.members.push(record);
    closePanel();
    persist(next);
  }

  function deleteMember(id) {
    var next = {
      people: state.people, meetings: state.meetings,
      members: state.members.filter(function (x) { return x.id !== id; }),
      tasks: state.tasks.filter(function (t) { return t.memberId !== id; })
    };
    closePanel();
    persist(next);
  }

  function addTask(memberId, title, deadline) {
    title = (title || "").trim();
    if (!title || !memberId) return;
    var next = {
      people: state.people, meetings: state.meetings, members: state.members,
      tasks: state.tasks.concat([{ id: uid(), memberId: memberId, title: title, deadline: deadline || "", done: false }])
    };
    persist(next);
  }

  function toggleTask(id) {
    var next = {
      people: state.people, meetings: state.meetings, members: state.members,
      tasks: state.tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { done: !t.done }) : t; })
    };
    persist(next);
  }

  function deleteTask(id) {
    var next = {
      people: state.people, meetings: state.meetings, members: state.members,
      tasks: state.tasks.filter(function (t) { return t.id !== id; })
    };
    persist(next);
  }

  /* ---------------- render ---------------- */
  function render() {
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML = renderShell();
    wireGlobal();
    if (ui.panelOpen) { if (ui.panelKind === "member") wireMemberPanel(); else wirePanel(); }
  }

  function renderShell() {
    var syncBadge = persistMode === "firebase"
      ? '<span class="sync-badge sync-live">&#9679; Live &mdash; shared</span>'
      : (persistMode === "local" ? '<span class="sync-badge sync-local">&#9679; This device only</span>' : "");
    var header =
      '<header class="top">' +
        '<div class="wordmark"><img class="brandmark" src="' + LOGO_DATA_URI + '" alt="ACM logo"><h1>ACM Tracker</h1><span class="tag">votes &amp; attendance</span>' + syncBadge + '</div>' +
        '<div class="top-actions">' +
          '<button class="theme-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">' + (currentIsDark() ? "☀" : "☾") + '</button>' +
        '</div>' +
      '</header>';

    var nav = '<nav class="rail">' +
      GROUPS.map(function (g) {
        var n = meetingsForGroup(g.key).length;
        return '<button data-tab="' + g.key + '" class="' + (ui.tab === g.key ? "active" : "") + '">' +
          escapeHtml(g.label) + '<span class="count">' + n + '</span></button>';
      }).join("") +
      '<hr>' +
      '<button data-tab="overview" class="' + (ui.tab === "overview" ? "active" : "") + '">Overview</button>' +
      '<button data-tab="people" class="' + (ui.tab === "people" ? "active" : "") + '">People<span class="count">' + state.people.length + '</span></button>' +
      '<button data-tab="members" class="' + (ui.tab === "members" ? "active" : "") + '">Members<span class="count">' + state.members.length + '</span></button>' +
      '<button data-tab="tasks" class="' + (ui.tab === "tasks" ? "active" : "") + '">Tasks<span class="count">' + state.tasks.filter(function (t) { return !t.done; }).length + '</span></button>' +
      '</nav>';

    var view;
    if (ui.tab === "overview") view = renderOverview();
    else if (ui.tab === "people") view = renderPeople();
    else if (ui.tab === "members") view = renderMembers();
    else if (ui.tab === "tasks") view = renderTasks();
    else view = renderGroup(ui.tab);

    var main = '<main class="view">' + view + '</main>';

    var panel = ui.panelOpen ? (ui.panelKind === "member" ? renderMemberPanel() : renderPanel()) : '<div class="panel" aria-hidden="true"></div>';
    var scrim = '<div class="scrim ' + (ui.panelOpen ? "show" : "") + '" id="scrim"></div>';

    return header + '<div class="body-wrap">' + nav + main + '</div>' + scrim + panel;
  }

  function currentIsDark() {
    if (ui.theme) return ui.theme === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function renderGroup(groupKey) {
    var g = GROUPS.filter(function (x) { return x.key === groupKey; })[0];
    var list = meetingsForGroup(groupKey);
    var writeNote = canWrite ? "" : '<div class="banner">This view can&#39;t save changes — open ACM Tracker from your own chat to edit.</div>';

    var head = '<div class="view-head"><div><h2>' + escapeHtml(g.label) + '</h2>' +
      '<p class="sub">' + list.length + ' logged entr' + (list.length === 1 ? "y" : "ies") + '</p></div>' +
      '<button class="btn" data-action="new-meeting" data-group="' + groupKey + '">+ New entry</button></div>';

    var rows;
    if (!list.length) {
      rows = '<div class="empty"><div class="big">Nothing logged yet</div>Add the first meeting or announcement for ' + escapeHtml(g.label) + '.</div>';
    } else {
      rows = '<div class="ledger">' + list.map(function (m) {
        var voted = m.votedIds.length, attended = m.attendedIds.length;
        var pct = voted > 0 ? Math.round((attended / voted) * 100) : (attended > 0 ? 100 : 0);
        var typeClass = TYPE_CLASS[m.type] || "type-other";
        return '<div class="entry-row" data-open="' + m.id + '">' +
          '<div class="entry-name">' + escapeHtml(m.name || "Untitled") +
            '<span class="type-pill ' + typeClass + '">' + escapeHtml(m.type || "Other") + '</span></div>' +
          '<div class="entry-date">' + formatDate(m.date) + '</div>' +
          '<div class="entry-time">' + formatTime(m.time) + '</div>' +
          '<div class="entry-ratio"><span class="nums">' + attended + ' / ' + voted + '</span>' +
            '<div class="bar"><span style="width:' + Math.min(pct, 100) + '%"></span></div></div>' +
          '<div class="chev">›</div>' +
        '</div>';
      }).join("") + '</div>';
    }
    return writeNote + head + rows;
  }

  function renderPeople() {
    var writeNote = canWrite ? "" : '<div class="banner">This view can&#39;t save changes — open ACM Tracker from your own chat to edit.</div>';
    var head = '<div class="view-head"><div><h2>People</h2><p class="sub">Shared roster used across all three groups</p></div></div>';
    var addForm = '<div class="add-inline"><input type="text" id="new-person-input" placeholder="Full name"><button class="btn small" id="add-person-btn">Add</button></div>';
    var rows;
    if (!state.people.length) {
      rows = '<div class="empty"><div class="big">No one on the roster yet</div>Add names here, or while logging a meeting.</div>';
    } else {
      rows = '<div class="people-grid">' + state.people.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (p) {
        return '<div class="person-row"><span class="nm">' + escapeHtml(p.name) + '</span>' +
          '<button class="rm" data-remove-person="' + p.id + '" title="Remove from roster" aria-label="Remove ' + escapeHtml(p.name) + '">×</button></div>';
      }).join("") + '</div>';
    }
    return writeNote + head + addForm + rows;
  }

  function renderMemberRow(m) {
    var posClass = POSITION_CLASS[m.position] || "pos-events";
    var contact = [m.email, m.phone].filter(Boolean).join(" · ");
    return '<div class="member-row" data-open-member="' + m.id + '">' +
      '<div class="member-main"><span class="member-name">' + escapeHtml(m.name || "Unnamed") + '</span>' +
        '<span class="type-pill ' + posClass + '">' + escapeHtml(m.position || "") + '</span></div>' +
      '<div class="member-sub">' + escapeHtml(m.major || "") + (m.major && contact ? ' &middot; ' : '') + escapeHtml(contact) + '</div>' +
    '</div>';
  }

  function renderMembers() {
    var writeNote = canWrite ? "" : '<div class="banner">This view can&#39;t save changes — open ACM Tracker from your own chat to edit.</div>';
    var head = '<div class="view-head"><div><h2>Members</h2><p class="sub">' + state.members.length + ' member' + (state.members.length === 1 ? "" : "s") + ' — auto-grouped by role into Board, Events, Tech &amp; Creative</p></div>' +
      '<button class="btn" data-action="new-member">+ New member</button></div>';
    var body;
    if (!state.members.length) {
      body = '<div class="empty"><div class="big">No members added yet</div>Add a member and pick their position — they\u2019ll be sorted into Board, Events, Tech or Creative automatically.</div>';
    } else {
      body = MEMBER_GROUPS.map(function (g) {
        var groupMembers = state.members.filter(function (m) { return (POSITION_GROUP[m.position] || "Events") === g; })
          .sort(function (a, b) {
            var ra = POSITION_RANK[a.position]; ra = (ra == null) ? 9 : ra;
            var rb = POSITION_RANK[b.position]; rb = (rb == null) ? 9 : rb;
            if (ra !== rb) return ra - rb;
            return a.name.localeCompare(b.name);
          });
        var inner = groupMembers.length
          ? groupMembers.map(renderMemberRow).join("")
          : '<div class="roster-empty">No one here yet</div>';
        return '<div class="member-group"><div class="member-group-title">' + g +
          '<span class="count">' + groupMembers.length + '</span></div>' + inner + '</div>';
      }).join("");
    }
    return writeNote + head + body;
  }

  function renderTasks() {
    var writeNote = canWrite ? "" : '<div class="banner">This view can&#39;t save changes — open ACM Tracker from your own chat to edit.</div>';
    var head = '<div class="view-head"><div><h2>Tasks</h2><p class="sub">Pick a member on the left to see and manage their tasks</p></div></div>';

    if (!state.members.length) {
      return writeNote + head + '<div class="empty"><div class="big">No members yet</div>Add people in the Members tab first, then assign tasks to them here.</div>';
    }

    var selId = ui.taskMemberId;
    if (!selId || !state.members.some(function (m) { return m.id === selId; })) {
      selId = state.members.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })[0].id;
    }

    var sidebar = MEMBER_GROUPS.map(function (g) {
      var ms = state.members.filter(function (m) { return (POSITION_GROUP[m.position] || "Events") === g; })
        .sort(function (a, b) {
          var ra = POSITION_RANK[a.position]; ra = (ra == null) ? 9 : ra;
          var rb = POSITION_RANK[b.position]; rb = (rb == null) ? 9 : rb;
          if (ra !== rb) return ra - rb;
          return a.name.localeCompare(b.name);
        });
      if (!ms.length) return "";
      var rows = ms.map(function (m) {
        var openCount = state.tasks.filter(function (t) { return t.memberId === m.id && !t.done; }).length;
        return '<button class="task-person ' + (m.id === selId ? "active" : "") + '" data-task-member="' + m.id + '">' +
          '<span>' + escapeHtml(m.name) + '</span>' +
          (openCount ? '<span class="count">' + openCount + '</span>' : '') +
        '</button>';
      }).join("");
      return '<div class="task-group-label">' + g + '</div>' + rows;
    }).join("");

    var member = state.members.filter(function (m) { return m.id === selId; })[0];
    var myTasks = state.tasks.filter(function (t) { return t.memberId === selId; }).sort(function (a, b) {
      if (!a.deadline && !b.deadline) return 0;
      if (!a.deadline) return 1;
      if (!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });
    var today = new Date().toISOString().slice(0, 10);

    var taskRows = myTasks.length
      ? myTasks.map(function (t) {
          var overdue = t.deadline && t.deadline < today && !t.done;
          return '<div class="task-row ' + (t.done ? "done" : "") + '">' +
            '<input type="checkbox" data-task-toggle="' + t.id + '" ' + (t.done ? "checked" : "") + '>' +
            '<span class="t-title">' + escapeHtml(t.title) + '</span>' +
            '<span class="t-deadline ' + (overdue ? "overdue" : "") + '">' + (t.deadline ? formatDate(t.deadline) : "No deadline") + '</span>' +
            '<button class="t-del" data-task-delete="' + t.id + '" aria-label="Delete task">×</button>' +
          '</div>';
        }).join("")
      : '<div class="roster-empty">No tasks yet for ' + escapeHtml(member.name) + '.</div>';

    var posClass = POSITION_CLASS[member.position] || "pos-events";
    var right =
      '<div class="task-member-head"><h3>' + escapeHtml(member.name) + '<span class="type-pill ' + posClass + '" style="margin-left:9px;">' + escapeHtml(member.position || "") + '</span></h3></div>' +
      '<div class="task-add-row">' +
        '<input type="text" id="task-title-input" placeholder="New task…">' +
        '<input type="date" id="task-deadline-input">' +
        '<button class="btn small" id="task-add-btn">+ Add</button>' +
      '</div>' +
      '<div class="task-list">' + taskRows + '</div>';

    return writeNote + head + '<div class="tasks-layout"><div class="tasks-sidebar">' + sidebar + '</div><div class="tasks-main">' + right + '</div></div>';
  }

  function renderOverview() {
    var totalMeetings = state.meetings.length;
    var totalVotes = state.meetings.reduce(function (s, m) { return s + m.votedIds.length; }, 0);
    var totalAttended = state.meetings.reduce(function (s, m) { return s + m.attendedIds.length; }, 0);
    var overallPct = totalVotes > 0 ? Math.round((totalAttended / totalVotes) * 100) : 0;

    var cards = '<div class="stat-cards">' +
      statCard(totalMeetings, "entries logged") +
      statCard(state.people.length, "people on roster") +
      statCard(totalVotes, "total votes to attend") +
      statCard((totalVotes > 0 ? overallPct + "%" : "—"), "overall turnout") +
      '</div>';

    // votes by type
    var byType = {};
    TYPES.forEach(function (t) { byType[t] = 0; });
    state.meetings.forEach(function (m) { byType[m.type] = (byType[m.type] || 0) + m.votedIds.length; });
    var maxType = Math.max.apply(null, Object.keys(byType).map(function (k) { return byType[k]; }).concat([1]));
    var typeBars = TYPES.filter(function (t) { return byType[t] > 0; }).sort(function (a, b) { return byType[b] - byType[a]; }).map(function (t) {
      var pct = Math.round((byType[t] / maxType) * 100);
      var colorVar = { "Online meeting": "var(--teal)", "In-person meeting": "var(--gold)", "Volunteering": "var(--green)", "Workshop": "var(--plum)", "Social": "var(--red)", "Other": "var(--ink-soft)" }[t];
      return '<div class="bar-row"><span class="lbl">' + escapeHtml(t) + '</span><div class="track"><span style="width:' + pct + '%;background:' + colorVar + '"></span></div><span class="val">' + byType[t] + ' votes</span></div>';
    }).join("");
    var typeBlock = '<div class="insight-block"><h4>Votes by type of announcement</h4>' +
      (typeBars || '<p class="sub">Log a few entries to see this break down.</p>') + '</div>';

    // turnout by group
    var groupBars = GROUPS.map(function (g) {
      var ms = meetingsForGroup(g.key);
      var v = ms.reduce(function (s, m) { return s + m.votedIds.length; }, 0);
      var a = ms.reduce(function (s, m) { return s + m.attendedIds.length; }, 0);
      var pct = v > 0 ? Math.round((a / v) * 100) : 0;
      return '<div class="bar-row"><span class="lbl">' + escapeHtml(g.label) + '</span><div class="track"><span style="width:' + pct + '%;background:var(--green)"></span></div><span class="val">' + (v > 0 ? pct + "%" : "—") + '</span></div>';
    }).join("");
    var groupBlock = '<div class="insight-block"><h4>Turnout by team (attended ÷ voted)</h4>' + groupBars + '</div>';

    // best times
    var byTime = {};
    state.meetings.forEach(function (m) {
      if (!m.time) return;
      byTime[m.time] = byTime[m.time] || { votes: 0, count: 0 };
      byTime[m.time].votes += m.votedIds.length;
      byTime[m.time].count += 1;
    });
    var timeKeys = Object.keys(byTime).sort(function (a, b) { return byTime[b].votes - byTime[a].votes; }).slice(0, 6);
    var timeRows = timeKeys.map(function (t) {
      var d = byTime[t];
      return '<div class="time-row"><span class="t">' + formatTime(t) + '</span><span class="v">' + d.votes + ' votes across ' + d.count + ' ' + (d.count === 1 ? "entry" : "entries") + '</span></div>';
    }).join("");
    var timeBlock = '<div class="insight-block"><h4>Timings with the most votes</h4>' +
      (timeRows ? '<div class="time-list">' + timeRows + '</div>' : '<p class="sub">No timed entries logged yet.</p>') + '</div>';

    return '<div class="view-head"><div><h2>Overview</h2><p class="sub">Across Events, Technical Team and Board Members</p></div></div>' +
      cards + typeBlock + groupBlock + timeBlock;
  }

  function statCard(num, lbl) {
    return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + escapeHtml(lbl) + '</div></div>';
  }

  function renderPanel() {
    var isEdit = !!ui.editingId;
    var d = draft;
    var q = ui.rosterQuery.toLowerCase();
    var people = state.people.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; })
      .concat(d.newPeople.map(function (nm, i) { return { id: "__new" + i, name: nm, isNew: true }; }))
      .sort(function (a, b) { return a.name.localeCompare(b.name); });

    function checklistCol(kind, arr) {
      if (!people.length) return '<div class="roster-empty">No matches. Add a name below.</div>';
      return people.map(function (p) {
        var checked = arr.indexOf(p.id) !== -1 || (p.isNew && arr.indexOf(p.name) !== -1);
        var pid = p.id;
        return '<div class="roster-person">' +
          '<input type="checkbox" id="' + kind + '-' + pid + '" data-roster="' + kind + '" data-pid="' + escapeHtml(pid) + '" ' + (checked ? "checked" : "") + '>' +
          '<label for="' + kind + '-' + pid + '">' + escapeHtml(p.name) + '</label></div>';
      }).join("");
    }

    var typeOptions = TYPES.map(function (t) {
      return '<option value="' + escapeHtml(t) + '" ' + (d.type === t ? "selected" : "") + '>' + escapeHtml(t) + '</option>';
    }).join("");

    return '<div class="panel show">' +
      '<div class="panel-head"><h3>' + (isEdit ? "Edit entry" : "New entry") + '</h3>' +
      '<button class="panel-close" id="panel-close" aria-label="Close">×</button></div>' +
      '<div class="panel-body">' +
        '<div class="field"><label>Meeting / announcement name</label><input type="text" id="f-name" value="' + escapeHtml(d.name) + '" placeholder="e.g. Hackathon kickoff"></div>' +
        '<div class="row2">' +
          '<div class="field"><label>Type</label><select id="f-type">' + typeOptions + '</select></div>' +
          '<div class="field"><label>Date</label><input type="date" id="f-date" value="' + escapeHtml(d.date) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Time</label><input type="time" id="f-time" value="' + escapeHtml(d.time) + '"></div>' +
        '<div class="field roster-search"><label>Search roster</label><input type="text" id="f-roster-search" placeholder="Filter names…" value="' + escapeHtml(ui.rosterQuery) + '"></div>' +
        '<div class="roster-cols">' +
          '<div><div class="col-title">Voted to attend</div>' + checklistCol("voted", d.votedIds) + '</div>' +
          '<div><div class="col-title">Actually attended</div>' + checklistCol("attended", d.attendedIds) + '</div>' +
        '</div>' +
        '<div class="add-person-row"><input type="text" id="f-new-person" placeholder="Add a new name to the roster"><button class="btn ghost small" id="f-add-person">Add</button></div>' +
      '</div>' +
      '<div class="panel-foot">' +
        (isEdit ? '<button class="btn danger" id="f-delete">Delete</button>' : '<span></span>') +
        '<div class="right"><button class="btn ghost" id="f-cancel">Cancel</button><button class="btn" id="f-save">Save entry</button></div>' +
      '</div>' +
    '</div>';
  }

  function renderMemberPanel() {
    var isEdit = !!ui.editingId;
    var d = memberDraft;
    var posOptions = POSITIONS.map(function (p) {
      return '<option value="' + escapeHtml(p) + '" ' + (d.position === p ? "selected" : "") + '>' + escapeHtml(p) + '</option>';
    }).join("");
    return '<div class="panel show">' +
      '<div class="panel-head"><h3>' + (isEdit ? "Edit member" : "New member") + '</h3>' +
      '<button class="panel-close" id="m-panel-close" aria-label="Close">×</button></div>' +
      '<div class="panel-body">' +
        '<div class="field"><label>Full name</label><input type="text" id="m-name" value="' + escapeHtml(d.name) + '" placeholder="e.g. Sara Al-Emadi"></div>' +
        '<div class="field"><label>Position</label><select id="m-position">' + posOptions + '</select></div>' +
        '<div class="field"><label>Major</label><input type="text" id="m-major" value="' + escapeHtml(d.major) + '" placeholder="e.g. Computer Science"></div>' +
        '<div class="row2">' +
          '<div class="field"><label>Phone</label><input type="text" id="m-phone" value="' + escapeHtml(d.phone) + '" placeholder="+974…"></div>' +
          '<div class="field"><label>Email</label><input type="text" id="m-email" value="' + escapeHtml(d.email) + '" placeholder="name@qu.edu.qa"></div>' +
        '</div>' +
      '</div>' +
      '<div class="panel-foot">' +
        (isEdit ? '<button class="btn danger" id="m-delete">Delete</button>' : '<span></span>') +
        '<div class="right"><button class="btn ghost" id="m-cancel">Cancel</button><button class="btn" id="m-save">Save member</button></div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- wiring ---------------- */
  function wireGlobal() {
    var themeBtn = document.getElementById("theme-toggle");
    if (themeBtn) themeBtn.onclick = function () {
      var next = currentIsDark() ? "light" : "dark";
      ui.theme = next;
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("acm-tracker-theme", next); } catch (e) {}
      render();
    };

    document.querySelectorAll("nav.rail button[data-tab]").forEach(function (b) {
      b.onclick = function () { ui.tab = b.getAttribute("data-tab"); render(); };
    });

    document.querySelectorAll("[data-action='new-meeting']").forEach(function (b) {
      b.onclick = function () { openPanel(null, b.getAttribute("data-group")); };
    });

    document.querySelectorAll(".entry-row[data-open]").forEach(function (row) {
      row.onclick = function () { openPanel(row.getAttribute("data-open")); };
    });

    var newMemberBtn = document.querySelector("[data-action='new-member']");
    if (newMemberBtn) newMemberBtn.onclick = function () { openMemberPanel(null); };

    document.querySelectorAll("[data-open-member]").forEach(function (row) {
      row.onclick = function () { openMemberPanel(row.getAttribute("data-open-member")); };
    });

    var addPersonBtn = document.getElementById("add-person-btn");
    if (addPersonBtn) addPersonBtn.onclick = function () {
      var input = document.getElementById("new-person-input");
      addPerson(input.value);
      input.value = "";
    };
    var newPersonInput = document.getElementById("new-person-input");
    if (newPersonInput) newPersonInput.onkeydown = function (e) {
      if (e.key === "Enter") { addPersonBtn.click(); }
    };

    document.querySelectorAll("[data-remove-person]").forEach(function (b) {
      b.onclick = function () { removePerson(b.getAttribute("data-remove-person")); };
    });

    document.querySelectorAll("[data-task-member]").forEach(function (b) {
      b.onclick = function () { ui.taskMemberId = b.getAttribute("data-task-member"); render(); };
    });

    var taskAddBtn = document.getElementById("task-add-btn");
    if (taskAddBtn) taskAddBtn.onclick = function () {
      var titleInput = document.getElementById("task-title-input");
      var deadlineInput = document.getElementById("task-deadline-input");
      var memberId = ui.taskMemberId || (state.members.length ? state.members.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })[0].id : null);
      addTask(memberId, titleInput.value, deadlineInput.value);
      titleInput.value = ""; deadlineInput.value = "";
      titleInput.focus();
    };
    var taskTitleInput = document.getElementById("task-title-input");
    if (taskTitleInput) taskTitleInput.onkeydown = function (e) { if (e.key === "Enter") taskAddBtn.click(); };

    document.querySelectorAll("[data-task-toggle]").forEach(function (cb) {
      cb.onchange = function () { toggleTask(cb.getAttribute("data-task-toggle")); };
    });
    document.querySelectorAll("[data-task-delete]").forEach(function (b) {
      b.onclick = function () { deleteTask(b.getAttribute("data-task-delete")); };
    });

    var scrim = document.getElementById("scrim");
    if (scrim) scrim.onclick = closePanel;
  }

  function wirePanel() {
    var closeBtn = document.getElementById("panel-close");
    if (closeBtn) closeBtn.onclick = closePanel;
    var cancelBtn = document.getElementById("f-cancel");
    if (cancelBtn) cancelBtn.onclick = closePanel;

    var nameF = document.getElementById("f-name");
    if (nameF) nameF.oninput = function () { draft.name = nameF.value; };
    var typeF = document.getElementById("f-type");
    if (typeF) typeF.onchange = function () { draft.type = typeF.value; };
    var dateF = document.getElementById("f-date");
    if (dateF) dateF.oninput = function () { draft.date = dateF.value; };
    var timeF = document.getElementById("f-time");
    if (timeF) timeF.oninput = function () { draft.time = timeF.value; };

    var searchF = document.getElementById("f-roster-search");
    if (searchF) {
      searchF.oninput = function () { ui.rosterQuery = searchF.value; render(); };
      // keep focus after re-render
      searchF.focus();
      var val = searchF.value; searchF.value = ""; searchF.value = val;
    }

    document.querySelectorAll("[data-roster]").forEach(function (cb) {
      cb.onchange = function () {
        var kind = cb.getAttribute("data-roster");
        var pid = cb.getAttribute("data-pid");
        var key = kind === "voted" ? "votedIds" : "attendedIds";
        var isNew = pid.indexOf("__new") === 0;
        var refKey = isNew ? draft.newPeople[parseInt(pid.replace("__new", ""), 10)] : pid;
        var arr = draft[key];
        var i = arr.indexOf(refKey);
        if (cb.checked && i === -1) arr.push(refKey);
        if (!cb.checked && i !== -1) arr.splice(i, 1);
      };
    });

    var addPersonBtn = document.getElementById("f-add-person");
    var addPersonInput = document.getElementById("f-new-person");
    function addDraftPerson() {
      var nm = (addPersonInput.value || "").trim();
      if (!nm) return;
      draft.newPeople.push(nm);
      addPersonInput.value = "";
      render();
    }
    if (addPersonBtn) addPersonBtn.onclick = addDraftPerson;
    if (addPersonInput) addPersonInput.onkeydown = function (e) { if (e.key === "Enter") addDraftPerson(); };

    var deleteBtn = document.getElementById("f-delete");
    if (deleteBtn) deleteBtn.onclick = function () {
      if (confirm("Delete this entry? This can't be undone.")) deleteMeeting(draft.id);
    };

    var saveBtn = document.getElementById("f-save");
    if (saveBtn) saveBtn.onclick = function () {
      if (!draft.name.trim()) { nameF.focus(); return; }
      saveMeeting(draft);
    };
  }

  function wireMemberPanel() {
    var closeBtn = document.getElementById("m-panel-close");
    if (closeBtn) closeBtn.onclick = closePanel;
    var cancelBtn = document.getElementById("m-cancel");
    if (cancelBtn) cancelBtn.onclick = closePanel;

    var nameF = document.getElementById("m-name");
    if (nameF) nameF.oninput = function () { memberDraft.name = nameF.value; };
    var posF = document.getElementById("m-position");
    if (posF) posF.onchange = function () { memberDraft.position = posF.value; };
    var majorF = document.getElementById("m-major");
    if (majorF) majorF.oninput = function () { memberDraft.major = majorF.value; };
    var phoneF = document.getElementById("m-phone");
    if (phoneF) phoneF.oninput = function () { memberDraft.phone = phoneF.value; };
    var emailF = document.getElementById("m-email");
    if (emailF) emailF.oninput = function () { memberDraft.email = emailF.value; };

    var deleteBtn = document.getElementById("m-delete");
    if (deleteBtn) deleteBtn.onclick = function () {
      if (confirm("Remove this member? This can't be undone.")) deleteMember(memberDraft.id);
    };

    var saveBtn = document.getElementById("m-save");
    if (saveBtn) saveBtn.onclick = function () {
      if (!memberDraft.name.trim()) { nameF.focus(); return; }
      saveMember(memberDraft);
    };
  }

  render();
})();
</script>
</body>
</html>
